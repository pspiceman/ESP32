<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q24 회원 폰 시험 (오디오/BLE · MQTT)</title><style>
body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#0f1419;color:#e6edf3;margin:0;padding:12px;max-width:760px;margin:auto}
h1{font-size:18px;margin:0 0 8px}h1 small{opacity:.6;font-weight:500;margin-left:6px}
h2{font-size:14px;margin:14px 0 6px;color:#9ecbff;border-top:1px solid #30363d;padding-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
input,button,select{font:inherit;padding:7px 10px;border-radius:7px;border:1px solid #30363d;background:#161b22;color:#e6edf3}
button{cursor:pointer;background:#1f6feb;border-color:#1f6feb}button.g{background:#238636;border-color:#238636}button.r{background:#8b2a2a;border-color:#8b2a2a}button.n{background:#21262d;border-color:#30363d}button:disabled{opacity:.45}
#st{padding:3px 10px;border-radius:99px;font-size:13px;background:#6e2b2b}#st.on{background:#1a7f37}
.hint{opacity:.65;font-size:12.5px}
#log{height:190px;overflow:auto;background:#0b0f14;border:1px solid #30363d;border-radius:8px;padding:8px;font:12px/1.5 ui-monospace,Consolas,monospace}
.lv{display:inline-block;width:120px;height:10px;background:#21262d;border-radius:5px;overflow:hidden;vertical-align:middle}.lv i{display:block;height:100%;width:0;background:#3fb950}
.big{font-size:44px;font-weight:900;text-align:center;margin:6px 0}

.start{width:100%;font-size:19px;padding:13px}
</style></head><body>
<h1>Q24 회원 폰 시험 <small>MQTT 전용 · v0.1</small> <span id="st">끊김</span></h1>
<div class="row">브로커 <input id="url" size="30"> 테이블 ID <input id="tbl" size="9"></div>
<div class="row">나는 <select id="me"><option value="0">1P</option><option value="1">2P</option><option value="-1">관전(문구만 듣기)</option></select>
 음량 <input type="range" id="vol" min="0.2" max="1" step="0.1" value="1"> 속도 <input type="range" id="rate" min="0.8" max="1.6" step="0.1" value="1.1"></div>
<div class="row">앞 지연 <input type="range" id="lead" min="0" max="800" step="50" value="350"> <span id="leadv">350ms</span> <span class="hint">(헤드셋 첫 소리가 잘리면 늘리기)</span></div>
<button class="start" id="go">🔊 듣기 시작 (헤드셋 연결 후 누르기)</button>
<div class="big" id="sc">0 : 0</div><div id="last" class="big" style="font-size:24px;min-height:36px"></div>

<h2>오디오 출력 (판정 문구 → 헤드셋)</h2>
<div class="row"><button class="n" id="tt">소리 테스트</button><label><input type="checkbox" id="keep" checked> BLE 유지음(절전·백그라운드 방지)</label></div>

<h2>마이크 (헤드셋에 말하기 → 판정 PC)</h2>
<div class="row"><button class="n" id="vc">🎙 마이크 연결</button><button class="n" id="vm" disabled>마이크 끄기</button><span id="vcs" class="hint">미연결</span></div>
<div class="row">내 마이크 음량 <span class="lv"><i id="lv"></i></span></div>
<div class="hint" id="dev"></div>
<div id="log"></div>
<script>
/* 초소형 MQTT 3.1.1 over WebSocket 클라이언트 (QoS0, 의존성 없음) */
function MQ(url,onMsg,onState){
 let ws=null,timer=null,ping=null,buf=new Uint8Array(0),subs=[],alive=false,want=true;
 const enc=s=>{const b=new TextEncoder().encode(s);return [b.length>>8,b.length&255,...b];};
 const rl=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;};
 const pkt=(h,body)=>new Uint8Array([h,...rl(body.length),...body]);
 const send=p=>{if(ws&&ws.readyState===1)ws.send(p);};
 function parse(){
  while(buf.length>=2){
   let n=0,mul=1,i=1,ok=false;
   while(i<buf.length){const c=buf[i++];n+=(c&127)*mul;mul*=128;if(!(c&128)){ok=true;break;}}
   if(!ok||buf.length<i+n)return;
   const t=buf[0]>>4,body=buf.slice(i,i+n);buf=buf.slice(i+n);
   if(t===2){alive=true;onState&&onState('connected');subs.forEach(s=>sub(s,true));}
   else if(t===3){const L=(body[0]<<8)|body[1];const topic=new TextDecoder().decode(body.slice(2,2+L));onMsg(topic,new TextDecoder().decode(body.slice(2+L)));}
  }
 }
 function open(){
  if(!want)return;onState&&onState('connecting');
  try{ws=new WebSocket(url,'mqtt');}catch(e){onState&&onState('error');timer=setTimeout(open,3000);return;}
  ws.binaryType='arraybuffer';
  ws.onopen=()=>send(pkt(0x10,[...enc('MQTT'),4,2,0,30,...enc('q24-'+Math.random().toString(36).slice(2,10))]));
  ws.onmessage=e=>{const a=new Uint8Array(e.data),m=new Uint8Array(buf.length+a.length);m.set(buf);m.set(a,buf.length);buf=m;parse();};
  ws.onclose=ws.onerror=()=>{if(alive){alive=false;onState&&onState('disconnected');}clearInterval(ping);if(want){clearTimeout(timer);timer=setTimeout(open,3000);}};
  clearInterval(ping);ping=setInterval(()=>send(new Uint8Array([0xC0,0])),20000);
 }
 function sub(t,re){if(!re&&!subs.includes(t))subs.push(t);if(alive)send(pkt(0x82,[0,1,...enc(t),0]));}
 function pub(t,s){const p=new TextEncoder().encode(s);send(pkt(0x30,[...enc(t),...p]));}
 function close(){want=false;clearTimeout(timer);clearInterval(ping);try{ws&&ws.close();}catch(e){}}
 open();return {sub,pub,close,get ok(){return alive;}};
}

const $=id=>document.getElementById(id);const QP=new URLSearchParams(location.search);const DEMO='wss://broker.emqx.io:8084/mqtt';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}};
$('url').value=QP.get('b')||DEMO;$('tbl').value=QP.get('t')||ls('q24m_ptbl')||'';
try{$('lead').value=ls('q24m_lead')||350;$('me').value=ls('q24m_me')||'0';}catch(e){}$('leadv').textContent=$('lead').value+'ms';
$('lead').oninput=()=>{$('leadv').textContent=$('lead').value+'ms';ls('q24m_lead',$('lead').value);};$('me').onchange=()=>ls('q24m_me',$('me').value);
const log=s=>{const d=$('log');d.insertAdjacentHTML('beforeend',new Date().toLocaleTimeString()+' '+s+'<br>');d.scrollTop=1e9;};
let mq=null,keepEl=null,wake=null;const seen=[];
const T=s=>'q24/'+$('tbl').value.trim()+'/'+s;const meId=()=>'p'+$('me').value;
/* ---- 음성 출력 (TTS, 순서대로 이어 읽기) ---- */
let AC=null,UT=null;window.__lastEnd=0;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function wakeTone(){try{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=900;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(.04,a.currentTime+.02);g.gain.linearRampToValueAtTime(0,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2);}catch(e){}}
function speak(t){try{const ss=window.speechSynthesis;if(!ss){log('⚠ TTS 미지원 브라우저 (크롬 사용)');return;}try{ss.resume();}catch(e){}
 const idle=Date.now()-window.__lastEnd>1500;let d=60;if(idle){d=Math.max(60,+$('lead').value||0);if(d>60)wakeTone();}
 setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);UT=u;u.lang='ko-KR';u.volume=+$('vol').value;u.rate=+$('rate').value;
  try{const ko=ss.getVoices().filter(v=>/^ko/i.test(v.lang));if(ko.length)u.voice=ko.find(v=>v.localService)||ko[0];}catch(e){}
  u.onstart=()=>log('· TTS 시작'+(u.voice?' ('+u.voice.name+')':''));u.onend=()=>{window.__lastEnd=Date.now();};u.onerror=e=>log('⚠ 음성 오류: '+(e.error||'?'));ss.speak(u);},d);}catch(e){log('⚠ '+e);}}
function silentWav(){const sr=8000,N=sr*10,n=N*2,b=new ArrayBuffer(44+n),d=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n,true);
 for(let i=0;i<N;i++)d.setInt16(44+i*2,Math.round(80*Math.sin(2*Math.PI*50*i/sr)),true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
/* ---- MQTT ---- */
function onMsg(topic,msg){let o;try{o=JSON.parse(msg);}catch(e){return;}
 if(topic.endsWith('/rtc')){vsig(o);return;}
 if(topic.endsWith('/ai')&&o.type==='say'){if(o.seq!=null){if(seen.includes(o.seq))return;seen.push(o.seq);if(seen.length>40)seen.shift();}
  if(o.for&&+$('me').value>=0&&o.for!==meId())return;
  if(o.score)$('sc').textContent=o.score[0]+' : '+o.score[1];$('last').textContent=o.say;log('수신('+Math.max(0,Date.now()-o.at)+'ms*): '+o.say);speak(o.say);}}
$('go').onclick=async()=>{if(!$('tbl').value.trim()){alert('PC 화면의 테이블 ID를 입력하세요');return;}ls('q24m_ptbl',$('tbl').value.trim());
 ac();speak('연결합니다');
 if($('keep').checked){if(!keepEl){keepEl=Object.assign(new Audio(silentWav()),{loop:true,volume:.5});keepEl.setAttribute('playsinline','');keepEl.style.display='none';document.body.appendChild(keepEl);}keepEl.play().catch(()=>{});
  try{navigator.mediaSession.metadata=new MediaMetadata({title:'Q24 회원 폰',artist:'판정 음성 대기 중'});navigator.mediaSession.playbackState='playing';['play','pause','stop'].forEach(a=>{try{navigator.mediaSession.setActionHandler(a,()=>{try{keepEl.play();}catch(e){}});}catch(e){}});}catch(e){}}
 try{wake=await navigator.wakeLock.request('screen');}catch(e){}
 if(mq)mq.close();mq=MQ($('url').value.trim(),onMsg,s=>{$('st').textContent=s==='connected'?'연결됨':s==='connecting'?'연결 중…':'끊김';$('st').className=s==='connected'?'on':'';
  if(s==='connected'){mq.sub(T('ai'));mq.sub(T('rtc'));log('구독: '+T('ai'));}});
 $('go').textContent='● 듣는 중 (다시 누르면 재연결)';devs();};
$('tt').onclick=()=>{ac();wakeTone();speak('소리 테스트입니다. 들리면 정상입니다.');devs();};
/* ---- 마이크 (WebRTC → 판정 PC) ---- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};let vpc=null,vst=null,vtimer=null;const vseen=[];
function gather(pc){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r();}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,2500);});}
function vpub(o){if(mq&&mq.ok)mq.pub(T('rtc'),JSON.stringify(o));}
async function devs(){try{const d=await navigator.mediaDevices.enumerateDevices();const f=k=>d.filter(x=>x.kind===k).map(x=>x.label||'(이름 숨김)').join(' / ')||'—';
 $('dev').innerHTML='마이크: '+f('audioinput')+'<br>스피커: '+f('audiooutput');}catch(e){}}
try{navigator.mediaDevices.addEventListener('devicechange',()=>{log('오디오 장치 변경 감지 (블루투스 연결/해제)');devs();});}catch(e){}
async function vconnect(){const me=+$('me').value;if(me<0){log('⚠ "나는" 을 1P 또는 2P 로 선택');return;}
 if(!mq||!mq.ok){log('⚠ 먼저 "듣기 시작"을 누르세요');return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){log('⚠ 마이크는 https 주소에서만 됩니다 (GitHub Pages 등)');return;}
 vend();try{vst=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}catch(e){log('⚠ 마이크 허용 필요: '+e.message);return;}
 const tr=vst.getAudioTracks()[0];log('마이크 사용: '+(tr&&tr.label||'?'));devs();
 try{const ac2=new (window.AudioContext||window.webkitAudioContext)();ac2.resume();const an=ac2.createAnalyser();an.fftSize=256;ac2.createMediaStreamSource(vst).connect(an);const buf=new Uint8Array(an.fftSize);
  const tick=()=>{if(!vst)return;an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));$('lv').style.width=Math.min(100,m*1.6)+'%';requestAnimationFrame(tick);};tick();}catch(e){}
 vpc=new RTCPeerConnection(ICE);vst.getTracks().forEach(t=>vpc.addTrack(t,vst));
 vpc.onconnectionstatechange=()=>{const s=vpc.connectionState;$('vcs').textContent=({connected:'✅ 판정 PC와 연결됨 (말하면 전달)',connecting:'연결 중…',failed:'❌ 연결 실패',disconnected:'끊김',new:'대기'}[s]||s);log('통화 '+s);if(s==='connected')clearTimeout(vtimer);};
 const off=await vpc.createOffer();await vpc.setLocalDescription(off);await gather(vpc);
 vpub({id:Math.random().toString(36).slice(2,9),to:'pc',from:meId(),type:'offer',sdp:vpc.localDescription.sdp});
 $('vcs').textContent='판정 PC 응답 대기…';$('vm').disabled=false;$('vm').textContent='마이크 끄기';
 clearTimeout(vtimer);vtimer=setTimeout(()=>{if(vpc&&vpc.connectionState!=='connected')log('⚠ 판정 PC 응답 없음: PC 페이지가 열려 있고 테이블 ID가 같은지 확인');},9000);}
function vend(){try{vpc&&vpc.close();}catch(e){}vpc=null;try{vst&&vst.getTracks().forEach(t=>t.stop());}catch(e){}vst=null;}
async function vsig(o){if(!o||o.to!==meId()&&o.to!=='all'||vseen.includes(o.id))return;vseen.push(o.id);
 if(o.type==='ping'){vpub({id:Math.random().toString(36).slice(2,9),to:'pc',from:meId(),type:'pong',at:o.at});return;}
 if(o.type==='answer'){try{if(vpc&&vpc.signalingState==='have-local-offer')await vpc.setRemoteDescription({type:'answer',sdp:o.sdp});}catch(e){log('⚠ 연결 오류: '+e.message);}}}
$('vc').onclick=vconnect;
$('vm').onclick=()=>{if(!vst)return;const t=vst.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('vm').textContent=t.enabled?'마이크 끄기':'마이크 켜기';log(t.enabled?'마이크 켜짐':'마이크 꺼짐');};
document.addEventListener('visibilitychange',async()=>{log(document.hidden?'· 백그라운드로 이동'+(keepEl&&!keepEl.paused?' (유지음 재생 중)':' (⚠ 유지음 멈춤)'):'· 화면 복귀');if(!document.hidden){if(wake&&wake.released){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}if(keepEl&&keepEl.paused&&$('keep').checked)keepEl.play().catch(()=>{});}});
log('1) 블루투스 헤드셋 연결 → 2) 듣기 시작 → 3) 마이크 연결');
</script></body></html>
