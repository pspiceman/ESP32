<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a1018"><title>3Q 코칭 · 회원</title>
<link rel="icon" type="image/png" href="./coach-192.png"><link rel="apple-touch-icon" href="./coach-192.png">
<style>
:root{--bg:#0a1018;--panel:#111a25;--line:#22313f;--text:#e9eef5;--muted:#8ea0b2;--mint:#6ff0c2;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a1018ee;backdrop-filter:blur(6px);z-index:5}
.brand{display:flex;gap:7px;align-items:center}.logo{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font-weight:900;border-radius:8px;padding:2px 7px;box-shadow:0 0 12px #38bdf866}
button,select,input{font:inherit;color:inherit}
button,select{background:#162231;border:1px solid var(--line);border-radius:10px;min-height:42px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}.sm{min-height:34px;padding:4px 10px;font-size:13px}.ghost{background:transparent}
.primary{background:var(--blue);border-color:var(--blue);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
h1{font-size:22px;margin:4px 0}h2{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:12px;margin:2px 0 0;text-align:center}
.login{max-width:420px;margin:40px auto}.login form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.login input:not([type=checkbox]){background:#0b131c;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.login .keep{flex-direction:row;align-items:center;gap:8px}.msg{color:#ff9aa0;min-height:1.2em;margin:0}
.pname{font-size:24px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{background:#0e1722;border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column}
.kpi span{font-size:12px;color:var(--muted)}.kpi b{font-size:21px}.kpi i{font-style:normal;font-size:12px;color:var(--muted)}.kpi small{font-size:13px;color:var(--muted)}
.types{width:100%;border-collapse:collapse;font-size:14px}.types td,.types th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.types th{color:var(--muted);font-weight:600;font-size:12px}
.bar{display:inline-block;width:80px;height:8px;background:#ffffff1c;border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}
.game{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;margin:0 0 8px;padding:11px 13px;border-radius:12px}
.gl{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}.res.W{color:var(--mint);font-weight:800}.res.L{color:#ff8a8a;font-weight:800}
.bar1{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.stagebox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#cv{display:block;width:100%;touch-action:pan-y}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.tag{background:#0a1018d9;border:1px solid #c79a3c;color:#ffd58a;border-radius:8px;padding:2px 8px;font-size:12.5px}.tag.tech{border-color:#2c4a68;color:#bfe6ff}
.ctrl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row4{display:grid;grid-template-columns:1fr auto 1fr .8fr;gap:8px;align-items:center}.pos{color:var(--muted);font-size:13px;text-align:center;min-width:54px}
.plays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0e1722}
.pl button{flex:1;border:0;border-radius:0;background:transparent;font-weight:700}
.pl .ck{display:flex;align-items:center;justify-content:center;width:44px;border-left:1px solid var(--line);cursor:pointer}.pl .ck input{display:none}
.pl .ck i{width:16px;height:16px;border-radius:4px;border:2px solid currentColor}.pl.on .ck i{background:currentColor;box-shadow:inset 0 0 0 2px #0e1722}
.pl.rec{color:#6ff0c2}.pl.act{color:#ffd166}.pl.fix{color:#ff9ad5}
.vid{background:#1b1730;border-color:#3b2f66}
.story p{margin:0 0 8px}.fixT{color:#ffc2e6}.recT{color:#b4f7dc}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.tipc{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12.5px;gap:2px;background:#0e1722;border:1px solid var(--line);border-radius:12px;padding:8px}
.tipc canvas{width:64px;height:64px}.tipc b{font-size:13px}.tipc.rec b{color:#6ff0c2}.tipc.act b{color:#ffd166}.tipc.fix b{color:#ff9ad5}
@media(min-width:700px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* v1.10 home / shot / cumulative */
.hello{padding:14px 4px 4px}.hello .pname{font-size:26px}
h3.sub{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.glist{list-style:none;margin:0;padding:0;counter-reset:g}
.glist li{counter-increment:g}
.glist button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;margin:0 0 8px;padding:10px 12px;border-radius:12px;min-height:52px}
.glist button::before{content:counter(g)'.';color:var(--muted);font-weight:700;min-width:18px}
.gl1{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.gl1 b{font-size:15px}.gl1 .gm{font-size:13.5px;color:#cdd7e2}.gl1 .gt{font-size:12px;color:var(--muted)}
.res.W{color:var(--mint);font-weight:800}.res.L{color:#ff8a8a;font-weight:800}.res.D{color:var(--muted);font-weight:800}
.cum{width:100%;margin-top:12px;background:#14243a;border-color:#2b4a72;font-weight:700}
.tips{margin-top:10px}
.say h2{margin:0}.sayh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#sSay p{margin:0 0 7px;font-size:16px;line-height:1.55}#sSay .lb{display:inline-block;min-width:64px;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;text-align:center;vertical-align:1px}
#sSay .why .lb{background:#3a2430;color:#ffb3c1}#sSay .fix .lb{background:#3a2440;color:#ff9ad5}#sSay .rec .lb{background:#163a31;color:#6ff0c2}
#sSay p.speaking{color:#fff;text-shadow:0 0 10px #6ff0c255}
.story{font-size:13.5px;color:#c4cfdb}.story p{margin:0 0 6px}
.cum-dlg{width:min(860px,96vw);max-height:92vh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:0}
.cum-dlg::backdrop{background:#000b}.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh h2{margin:0}#cumBody{padding:12px 16px 18px}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--muted);font:11px system-ui}.chart .lab{fill:var(--text);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0 8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wl{display:flex;gap:4px;flex-wrap:wrap}.wl span{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.wl .W{background:#163a31;color:var(--mint)}.wl .L{background:#3a2026;color:#ff9aa0}.wl .D{background:#222c36;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:#0a1018f2;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;z-index:20;white-space:nowrap}
.demo{font-size:11.5px;color:#ffd58a;margin:0 0 8px}
</style></head><body>
<header class="top"><div class="brand"><span class="logo">3Q</span><b>코칭</b><span class="muted">회원</span></div><button id="bLogout" class="ghost sm">로그아웃</button></header>
<main>
<section id="scLogin" class="card login" hidden>
 <h1>내 3쿠션 코칭</h1><p class="muted">클럽에서 받은 회원코드와 PIN을 넣으세요.</p>
 <form id="lgForm"><label>회원코드<input id="lgCode" autocomplete="username" autocapitalize="characters" required></label>
  <label>PIN<input id="lgPin" type="password" inputmode="text" autocomplete="current-password" required></label>
  <label class="keep"><input id="lgKeep" type="checkbox" checked> 이 기기에서 로그인 유지</label>
  <button class="primary">보기</button><p id="lgMsg" class="msg"></p></form>
</section>
<section id="scHome" hidden>
 <div class="hello"><div class="pname" id="hName"></div><div class="muted" id="hSub"></div></div>
 <div class="card"><h2 id="todayT">오늘의 경기</h2><ol class="glist" id="games"></ol><div id="pastBox" hidden><h3 class="sub">지난 경기</h3><ol class="glist" id="past"></ol></div></div>
 <div class="card"><h2 id="anaT">샷 분석 · 오늘</h2><table class="types" id="types"></table>
  <button id="bCum" class="cum">📈 누적 분석 보기</button></div>
</section>
<section id="scShot" hidden>
 <div class="bar1"><button id="bBack" class="sm">◀ 이전</button><b id="gTitle"></b></div>
 <div class="stagebox"><canvas id="cv"></canvas><div class="tags"><span class="tag" id="sHead"></span><span class="tag tech" id="sTech" hidden></span></div></div>
 <div class="ctrl">
  <div class="row4"><button id="bPrev">◀ 이전</button><span id="sPos" class="pos"></span><button id="bNext">다음 ▶</button><select id="rate"><option value=".5">0.5×</option><option value="1" selected>1×</option></select></div>
  <div class="plays">
   <div class="pl act"><button id="b_act">▶ 실제</button><label class="ck"><input type="checkbox" id="c_act"><i></i></label></div>
   <div class="pl fix"><button id="b_fix">▶ 교정</button><label class="ck"><input type="checkbox" id="c_fix"><i></i></label></div>
   <div class="pl rec"><button id="b_rec">▶ 추천</button><label class="ck"><input type="checkbox" id="c_rec"><i></i></label></div>
  </div>
  <p class="muted small">화면을 탭하면 처음으로 · 좌우로 밀면 이전·다음 샷</p>
 </div>
 <div class="tips" id="sTips"></div>
 <div class="card say"><div class="sayh"><h2>🎧 코칭 멘트</h2><button id="bSay" class="sm">🔊 듣기</button></div><div id="sSay"></div></div>
 <div class="card story"><h3 class="sub">👉 자세한 설명</h3><div id="sBody"></div></div>
</section>
</main>
<dialog id="cumDlg" class="cum-dlg"><div class="dh"><h2>📈 누적 분석</h2><button id="cumX" class="sm ghost" aria-label="닫기">✕</button></div><div id="cumBody"></div></dialog>

<script>
function createPhysics(){
 'use strict';
 const W=2.84,H=1.42,R=.03075,D=2*R,G=9.81;
 const BASE=Object.freeze({slide:.20,roll:.012,railE:.82,railMu:.14,ballE:.96,spinDecay:.45,railRoll:.9});
 const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
 function validate(p){
  return Array.isArray(p)&&p.length===3&&p.every(a=>a&&Number.isFinite(a.x)&&Number.isFinite(a.y)&&a.x>=R+.001&&a.x<=W-R-.001&&a.y>=R+.001&&a.y<=H-R-.001)&&p.every((a,i)=>p.every((b,j)=>i===j||Math.hypot(a.x-b.x,a.y-b.y)>=D+.005));
 }
 // Same chronological rule as v3.6: freeze at SECOND DISTINCT object, not later rails.
 function ruleAtSecond(events){
  let cushions=0;const hit=new Set();
  for(const e of events){
   if(e.type==='cushion')cushions++;
   if(e.type==='ball'){
    hit.add(e.target);
    if(hit.size===2)return {score:cushions>=3,cushions,objects:[...hit],t:e.t};
   }
  }
  return {score:false,cushions,objects:[...hit],t:null};
 }
 function friction(b,h,cfg){
  const fullStep=h;
  const sx=b.vx-R*b.wy,sy=b.vy+R*b.wx,slip=Math.hypot(sx,sy);
  if(slip>.001){
   const ht=Math.min(h,slip/(3.5*cfg.slide*G)),factor=cfg.slide*G*ht/slip;
   const jx=-factor*sx,jy=-factor*sy;
   b.vx+=jx;b.vy+=jy;b.wx+=2.5*jy/R;b.wy-=2.5*jx/R;
   h-=ht;
  }
  if(h>1e-9){
   const speed=Math.hypot(b.vx,b.vy),k=speed>0?Math.max(0,1-cfg.roll*G*h/speed):0;
   b.vx*=k;b.vy*=k;b.wx=-b.vy/R;b.wy=b.vx/R;
  }
  b.wz*=Math.max(0,1-cfg.spinDecay*fullStep);
  if(Math.hypot(b.vx,b.vy)<.001&&Math.hypot(b.wx,b.wy)*R<.001){b.vx=b.vy=b.wx=b.wy=0;}
 }
 function simulate(pos,shot,opts={}){
  const cfg={...BASE,...(opts.model||{})},step=opts.dt||.02,maxC=opts.maxC||5,record=!!opts.record,maxT=opts.maxT||18;
  const balls=pos.map(p=>({x:p.x,y:p.y,vx:0,vy:0,wx:0,wy:0,wz:0}));
  const cb=balls[0],dx=Math.cos(shot.angle),dy=Math.sin(shot.angle),speed=shot.speed;
  cb.vx=dx*speed;cb.vy=dy*speed;
  cb.wx=-2.5*shot.tipY*speed*dy/R;cb.wy=2.5*shot.tipY*speed*dx/R;cb.wz=-2.5*shot.tipX*speed/R;
  let time=0,cushions=0,hitMask=0,pathLength=0,cut=null,firstTarget=null,ambiguous=false,ticks=0;
  const events=[],frames=record?[{t:0,p:balls.map(b=>({x:b.x,y:b.y}))}]:null;
  let savedAt=0,lastEvent=-100,terminal='stopped',thirdRailTime=-100;
  const approaches=Array.from({length:maxC+1},()=>null);let firstNear=null;
  // Swept closest approach to the remaining object, measured edge-to-edge in metres.
  function inspectApproach(h){
   for(let j=1;j<=2;j++){
    if(hitMask&(1<<j))continue;
    const q=balls[j],rx=cb.x-q.x,ry=cb.y-q.y,vx=cb.vx-q.vx,vy=cb.vy-q.vy;
    const vv=vx*vx+vy*vy,u=vv>1e-12?clamp(-(rx*vx+ry*vy)/vv,0,h):0;
    const gap=Math.max(0,Math.hypot(rx+vx*u,ry+vy*u)-D);
    const prev=hitMask===0?firstNear:approaches[cushions];
    if(!prev||gap<prev.gap){
     const item={gap,target:j,t:time+u,cushions,cue:{x:cb.x+cb.vx*u,y:cb.y+cb.vy*u},object:{x:q.x+q.vx*u,y:q.y+q.vy*u}};
     if(hitMask===0)firstNear=item;else if(cushions<=maxC)approaches[cushions]=item;
    }
   }
  }
  function frame(force){if(record&&(force||time-savedAt>=.036)){frames.push({t:time,p:balls.map(b=>({x:b.x,y:b.y}))});savedAt=time;}}
  for(let loop=0;loop<1800&&time<maxT;loop++){
   if(Math.hypot(cb.vx,cb.vy)<.022&&Math.hypot(cb.wx,cb.wy)*R<.03){terminal='stopped';break;}
   let remaining=step;
   for(let sub=0;sub<12&&remaining>1e-8;sub++){
    let tau=remaining,kind=0,ia=-1,ib=-1,rail=-1;
    for(let i=0;i<3;i++){
     const b=balls[i];let tr;
     if(b.vx<-.00001){tr=(R-b.x)/b.vx;if(tr>=-1e-7&&tr<tau){tau=Math.max(0,tr);kind=1;ia=i;rail=0;}}
     if(b.vx>.00001){tr=(W-R-b.x)/b.vx;if(tr>=-1e-7&&tr<tau){tau=Math.max(0,tr);kind=1;ia=i;rail=1;}}
     if(b.vy<-.00001){tr=(R-b.y)/b.vy;if(tr>=-1e-7&&tr<tau){tau=Math.max(0,tr);kind=1;ia=i;rail=2;}}
     if(b.vy>.00001){tr=(H-R-b.y)/b.vy;if(tr>=-1e-7&&tr<tau){tau=Math.max(0,tr);kind=1;ia=i;rail=3;}}
     for(let j=i+1;j<3;j++){
      const q=balls[j],px=q.x-b.x,py=q.y-b.y,vx=b.vx-q.vx,vy=b.vy-q.vy;
      const bdot=px*vx+py*vy;if(bdot<=.000001)continue;
      const aa=vx*vx+vy*vy,cc=px*px+py*py-D*D,disc=bdot*bdot-aa*cc;
      if(disc<0||aa<1e-10)continue;
      const tt=Math.max(0,(bdot-Math.sqrt(disc))/aa);
      if(tt<tau){tau=tt;kind=2;ia=i;ib=j;}
     }
    }
    inspectApproach(tau);
    pathLength+=Math.hypot(cb.vx,cb.vy)*tau;
    for(const b of balls){b.x+=b.vx*tau;b.y+=b.vy*tau;friction(b,tau,cfg);}
    time+=tau;remaining-=tau;ticks++;
    if(kind===1){
     if(ia===0&&cushions>=maxC){terminal='limit';break;}
     const b=balls[ia],nx=rail===0?1:rail===1?-1:0,ny=rail===2?1:rail===3?-1:0;
     const tx=-ny,ty=nx,vn=b.vx*nx+b.vy*ny,ut=b.vx*tx+b.vy*ty-R*b.wz;
     const jn=Math.max(0,-(1+cfg.railE)*vn),jt=clamp(-ut/3.5,-cfg.railMu*jn,cfg.railMu*jn);
     b.vx+=jn*nx+jt*tx;b.vy+=jn*ny+jt*ty;b.wz-=2.5*jt/R;
     // Cushion nose sits above the ball's equator: the impact largely re-aligns the rolling spin
     // with the rebound, so a plain ball leaves the rail close to the mirror angle instead of
     // curling away from it. Only the normal component is reset strongly; english still acts via jt.
     {const vrx=R*b.wy,vry=-R*b.wx,vrn=vrx*nx+vry*ny,vrt=vrx*tx+vry*ty,von=b.vx*nx+b.vy*ny,vot=b.vx*tx+b.vy*ty;
      const nn=vrn+(von-vrn)*cfg.railRoll,nt=vrt+(vot-vrt)*cfg.railRoll*.6,qx=nn*nx+nt*tx,qy=nn*ny+nt*ty;b.wy=qx/R;b.wx=-qy/R;}
     b.x=clamp(b.x+nx*1e-7,R,W-R);b.y=clamp(b.y+ny*1e-7,R,H-R);
     if(ia===0){
      cushions++;
      const e={type:'cushion',rail,t:time,x:b.x,y:b.y,number:cushions,confirmed:true};events.push(e);
      if(cushions===3)thirdRailTime=time;
      if(Math.min(b.x-R,W-R-b.x,b.y-R,H-R-b.y)<-1e-6)ambiguous=true;
      if(time-lastEvent<.012)ambiguous=true;
      lastEvent=time;frame(true);
     }
    }else if(kind===2){
     const a=balls[ia],b=balls[ib],sep=Math.hypot(b.x-a.x,b.y-a.y),nx=(b.x-a.x)/sep,ny=(b.y-a.y)/sep;
     const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
     if(rel<0){
      const preSpeed=Math.hypot(a.vx,a.vy),cos=preSpeed>0?clamp((a.vx*nx+a.vy*ny)/preSpeed,-1,1):1;
      const impulse=-(1+cfg.ballE)*rel/2;
      a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;
      if(ia===0){
       if(firstTarget===null){firstTarget=ib;cut=1-Math.sqrt(Math.max(0,1-cos*cos));}
       const fresh=!(hitMask&(1<<ib));hitMask|=(1<<ib);
       // Side of the object ball struck, seen from behind the cue ball (rotation-invariant).
       const pv=Math.hypot(a.vx+impulse*nx,a.vy+impulse*ny)||1,lx=(a.vy+impulse*ny)/pv,ly=-(a.vx+impulse*nx)/pv;
       const side=(-nx*lx-ny*ly)>=0?'L':'R';
       events.push({type:'ball',target:ib,t:time,x:a.x,y:a.y,ox:b.x,oy:b.y,fresh,side,confirmed:true});
       if(time-lastEvent<.012)ambiguous=true;
       lastEvent=time;frame(true);
      }else if(hitMask){events.push({type:'okiss',t:time,x:b.x,y:b.y});}
     }
     const correction=Math.max(0,D+1e-7-sep)/2;
     a.x-=nx*correction;a.y-=ny*correction;b.x+=nx*correction;b.y+=ny*correction;
    }else{frame(false);}
    if(hitMask===6){terminal='second';break;}
    if(cushions>maxC||pathLength>24){terminal='limit';break;}
   }
   if(terminal==='second'||terminal==='limit')break;
  }
  frame(true);
  const rule=ruleAtSecond(events),signature=events.filter(e=>e.type!=='okiss').map(e=>e.type==='ball'?'b'+e.target:'r'+e.rail).join('-');
  if(rule.t!==null&&Math.abs(rule.t-thirdRailTime)<.025)ambiguous=true;

    if(hi-lo>1e-6){const z=run({...f.shot,angle:(lo+hi)/2},.005,true);if(z.success&&classify(z).id===id)f=z;}
    const c=classify(f),tol=tolerance(f,id),gap=nearKiss(f);
    f.cls=c;f.tolerance=tol.deg;f.speedOK=tol.speedOK;f.kissGap=gap;f.difficulty=difficulty(f);
    f.ease=1;
    f.stance=stance(pos,f.shot,hand);
    f.rank=pen(c.id)+f.difficulty*.3-tol.deg*10-(tol.speedOK?.8:0)+(c.kiss?6:0)+(gap<.03?2:0)+Math.max(0,.18-f.cut)*12
      +(Math.abs(f.shot.tipX)>.3?.8:0)+(f.shot.tipY<0?.5:0)+(f.shot.speed>3.7?.3:0)+(f.stance.ok?0:20)+Math.max(0,f.stance.reach-.8)*1.5;
    f.rank-=tol.deg*15;
    f.close=close;
    if(!verified.some(v=>v.cls.id===c.id&&v.firstTarget===f.firstTarget&&Math.abs(v.shot.angle-f.shot.angle)<.01&&Math.sign(v.shot.tipX)===Math.sign(f.shot.tipX)))verified.push(f);
   }
  }
  // Beginner error model: aim sd 0.1 deg, speed sd 7 %, tip sd 0.04R. Fixed seed -> stable numbers.
  function successProb(f,n=20){
   let seed=12345,ok=0;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
   const g=()=>Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd());
   for(let i=0;i<n;i++){
    const sh={angle:f.shot.angle+g()*.1*Math.PI/180,speed:f.shot.speed*(1+g()*.07),tipX:f.shot.tipX+g()*.04,tipY:f.shot.tipY+g()*.04};
    tested++;const z=simulate(pos,sh,{maxC:5,dt:.01,model});if(z.success)ok++;
   }
   return ok/n;
  }
  function scoreProb(limit){
   const list=verified.filter(v=>v.prob==null&&v.stance&&v.stance.ok&&!v.cls.kiss).sort((a,b)=>a.rank-b.rank).slice(0,limit);
   for(const f of list){f.prob=successProb(f);f.ease=f.prob>=.35?3:f.prob>=.18?2:1;f.rank-=f.prob*10;}
  }
  function pick(){
   const sorted=[...verified].sort((a,b)=>a.rank-b.rank);
   const good=sorted.filter(v=>!v.cls.kiss&&v.cls.id!=='special'&&v.cls.id!=='unknown'&&v.stance&&v.stance.ok&&v.kissGap>=.012);
   const core=good.filter(v=>CORE.has(v.cls.id)),bank=good.filter(v=>v.cls.id==='bank'),other=good.filter(v=>!CORE.has(v.cls.id)&&v.cls.id!=='bank');
   let pool=core.length?core:other.length?other:bank;
   if(close&&bank.length&&(!core.length||bank[0].rank<core[0].rank+1.5))pool=[...pool,bank[0]].sort((a,b)=>a.rank-b.rank);
   if(!pool.length)pool=good.length?good:sorted;
   const out=[];for(const v of pool){if(out.length>=2)break;if(out.some(o=>o.cls.id===v.cls.id))continue;out.push(v);}
   // second card only if it is reasonably easy compared with the first
   if(out.length===2&&(out[1].rank-out[0].rank>4||(out[0].prob!=null&&out[1].prob!=null&&out[1].prob<out[0].prob*.5)))out.pop();
   return out;
  }
  const packet=(phase,p,extra={})=>({phase,progress:p,tested,found:verified.length,...extra});
  function result(extra={}){
   const routes=pick();
   return {routes,tested,skipped,hand,close,elapsedMs:clock()-started,fallback:!routes.length,...(options.returnAll?{all:verified}:{}),...extra};
  }
  // ---- Stage A: object-ball-first basic shots with beginner tips & speeds
  const TIPS=[[0,.3],[-.15,.3],[.15,.3],[-.28,.28],[.28,.28],[-.38,.2],[.38,.2],[0,0],[-.25,0],[.25,0],[0,-.25],[-.25,-.22],[.25,-.22]];
  const SPEEDS=[2.8,3.4,4.0],steps=options.steps||90,total=TIPS.length*SPEEDS.length*2*(steps+1);
  yield packet('basic',.02);
  for(let ti=0;ti<TIPS.length;ti++){
   const [tipX,tipY]=TIPS[ti];
   for(const speed of SPEEDS)for(let target=1;target<=2;target++){
    const dx=pos[target].x-pos[0].x,dy=pos[target].y-pos[0].y,base=Math.atan2(dy,dx),span=Math.asin(Math.min(.999,D/Math.hypot(dx,dy)));
    for(let i=0;i<=steps;i++){
     const shot={tipX,tipY,speed,angle:base+span*(-.985+1.97*i/steps)};if(playable(shot))consider(run(shot));
     if(tested%60===0)yield packet('basic',.03+.72*tested/total);
    }
   }
   if(ti===6){verify(10);scoreProb(4);yield packet('basic',.03+.72*tested/total,{interim:pick()});}
  }
  verify(20);scoreProb(8);
  const usable=verified.filter(v=>!v.cls.kiss&&CORE.has(v.cls.id)&&v.stance&&v.stance.ok);
  // ---- Stage B: bank shots only when objects are very close or nothing else works
  if(close||!usable.length){
   const reason=close?'close':'none';
   yield packet('bank',.8,{reason,interim:pick()});
   const KP=[{tipX:0,tipY:.3,speed:3.4},{tipX:0,tipY:.3,speed:4.0},{tipX:-.2,tipY:.3,speed:3.6},{tipX:.2,tipY:.3,speed:3.6}];
   const ww=W-D,hh=H-D,seeds=[];
   for(let target=1;target<=2;target++)for(let ix=-2;ix<=2;ix++)for(let iy=-2;iy<=2;iy++){
    if((ix===0&&iy===0)||Math.abs(ix)+Math.abs(iy)>3)continue;
    const x=R+ix*ww+(Math.abs(ix)%2?ww-(pos[target].x-R):pos[target].x-R),y=R+iy*hh+(Math.abs(iy)%2?hh-(pos[target].y-R):pos[target].y-R);
    const dx=x-pos[0].x,dy=y-pos[0].y;seeds.push({a:Math.atan2(dy,dx),s:Math.asin(Math.min(.999,D/Math.hypot(dx,dy)))});
   }
   for(const p of KP){
    for(const m of seeds)for(const u of [-.8,-.3,.3,.8]){const sh={...p,angle:m.a+m.s*u};if(playable(sh))consider(run(sh));}
    for(let i=0;i<300;i++){const sh={...p,angle:2*Math.PI*(i+.37)/300};if(playable(sh))consider(run(sh));if(tested%60===0)yield packet('bank',.8+.12*i/300);}
   }
   verify(28);scoreProb(8);
   if(verified.length)return result({bankReason:reason});
  }else return result();
  // ---- Stage C: nothing found -> wide fallback search of the base engine
  yield packet('wide',.9);
  const g=search(pos,1,{model,budgetMs:options.wideBudget||9000});let s;
  do{s=g.next();if(!s.done)yield packet('wide',.9+.09*(s.value.progress||0),{tested:tested+s.value.tested});}while(!s.done);
  tested+=s.value.tested;
  const routes=s.value.routes.map(r=>{r.cls=r.success?classify(r):null;r.ease=1;r.rank=99;r.close=close;r.stance=stance(pos,r.shot,hand);return r;});
  return {routes:routes.slice(0,1),hand,skipped,tested,close,elapsedMs:clock()-started,fallback:!routes.some(r=>r.success),wide:true};
 }

 return {W,H,R,D,BASE,validate,ruleAtSecond,simulate,search,difficulty,parameters,quality,preview,classify,beginnerSearch,stance:stanceFn,RAILNUM,CLOSE_DIST};
}

/* ---------- access: code + PIN -> file name hash, AES-GCM decrypt ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){const h=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function fileId(code,pin){return (await sha('3q:'+code.trim().toUpperCase()+':'+pin.trim())).slice(0,24);}
async function decrypt(box,code,pin){
 const km=await crypto.subtle.importKey('raw',enc.encode(code.trim().toUpperCase()+':'+pin.trim()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(box.salt),iterations:box.it||150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(box.iv)},key,b64d(box.ct));return JSON.parse(dec.decode(pt));}
async function login(code,pin,remember){
 $('lgMsg').textContent='불러오는 중…';
 try{const id=await fileId(code,pin);const r=await fetch(`./members/${id}.json`,{cache:'no-cache'});
  if(!r.ok)throw new Error(r.status===404?'회원코드나 PIN이 맞지 않아요.':'서버 응답 '+r.status);
  const d=await decrypt(await r.json(),code,pin);
  try{if(remember)localStorage.setItem('3q-member',JSON.stringify({code,pin}));else localStorage.removeItem('3q-member');}catch(e){}
  start(d);}
 catch(e){$('lgMsg').textContent=e.name==='OperationError'?'회원코드나 PIN이 맞지 않아요.':(e.message||'불러오지 못했어요.');}

/* ---------- TTS (later: bluetooth earset) ---------- */
function stopSay(){try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll('#sSay p').forEach(p=>p.classList.remove('speaking'));$('bSay').textContent='🔊 듣기';}
function say(){
 if(!('speechSynthesis' in window))return;if(speechSynthesis.speaking){stopSay();return;}
 const a=LIST[SH],sy=a&&a.say;if(!sy)return;const ps=[...document.querySelectorAll('#sSay p')],lines=[sy.why,sy.fix,sy.rec].filter(Boolean);
 const v=speechSynthesis.getVoices().find(x=>/ko/i.test(x.lang));$('bSay').textContent='⏹ 멈춤';
 lines.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(v)u.voice=v;u.rate=1;
  u.onstart=()=>{ps.forEach(p=>p.classList.remove('speaking'));ps[i]&&ps[i].classList.add('speaking');};
  if(i===lines.length-1)u.onend=()=>stopSay();speechSynthesis.speak(u);});}
$('bSay').onclick=say;
/* ---------- geometry / drawing ---------- */
const cv=$('cv'),cx=cv.getContext('2d');let SC=1,OX=0,OY=0,DPR=1;
function resize(){DPR=Math.min(2.5,window.devicePixelRatio||1);const w=cv.clientWidth,h=Math.round(w*0.56);cv.style.height=h+'px';cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
 const W=cv.width,H=cv.height,mx=W*.075,my=H*.13;SC=Math.min((W-2*mx)/2.84,(H-2*my)/1.42);OX=(W-SC*2.84)/2;OY=(H-SC*1.42)/2;}
const S2=(x,y)=>({x:OX+x*SC,y:OY+y*SC});
const BR=()=>P.R*SC;
function rr(x,y,w,h,r){cx.beginPath();if(cx.roundRect)cx.roundRect(x,y,w,h,r);else cx.rect(x,y,w,h);}
function table(){
 const W=cv.width,H=cv.height,pal=G.pal||{},a=S2(0,0),b=S2(2.84,1.42),m=SC;
 const fl=cx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,W*.75);fl.addColorStop(0,pal.floor0||'#1a2532');fl.addColorStop(1,pal.floor1||'#0a1018');cx.fillStyle=fl;cx.fillRect(0,0,W,H);
 const cu=(pal.cuW||.05)*m,rl=((pal.outer||.18)-(pal.cuW||.05))*m,rx=a.x-cu-rl,ry=a.y-cu-rl,rw=b.x-a.x+2*(cu+rl),rh=b.y-a.y+2*(cu+rl);
 cx.save();cx.shadowColor='#000c';cx.shadowBlur=.12*m;cx.shadowOffsetY=.03*m;rr(rx,ry,rw,rh,.05*m);cx.fillStyle=pal.rail1||'#2b1e16';cx.fill();cx.restore();
 const wd=cx.createLinearGradient(0,ry,0,ry+rh);wd.addColorStop(0,pal.rail0||'#4a3326');wd.addColorStop(.5,pal.rail||'#36251b');wd.addColorStop(1,pal.rail0||'#4a3326');rr(rx,ry,rw,rh,.05*m);cx.fillStyle=wd;cx.fill();
 cx.strokeStyle=pal.outer?'rgba(0,0,0,.75)':'#6b4d3a';cx.lineWidth=Math.max(1,(pal.outer?.008:.004)*m);cx.stroke();
 cx.fillStyle=pal.cush||'#1d5596';cx.fillRect(a.x-cu,a.y-cu,b.x-a.x+2*cu,b.y-a.y+2*cu);
 const cl=cx.createRadialGradient((a.x+b.x)/2,(a.y+b.y)/2,.1*m,(a.x+b.x)/2,(a.y+b.y)/2,1.6*m);cl.addColorStop(0,pal.cloth0||'#2f7ac9');cl.addColorStop(1,pal.cloth1||'#1f5ca6');cx.fillStyle=cl;cx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
 cx.strokeStyle=pal.line||'#5c94d3';cx.lineWidth=Math.max(1,.003*m);cx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
 cx.fillStyle=pal.dia||'#efe6d2';const dm=(x,y)=>{cx.save();cx.translate(x,y);cx.rotate(Math.PI/4);const s=.012*m;cx.fillRect(-s/2,-s/2,s,s);cx.restore();};
 const off=cu+rl*.5;for(let i=1;i<8;i++){const x=a.x+(b.x-a.x)*i/8;dm(x,a.y-off);dm(x,b.y+off);}for(let i=1;i<4;i++){const y=a.y+(b.y-a.y)*i/4;dm(a.x-off,y);dm(b.x+off,y);}
}
function ball(p,i,alpha=1){const r=BR(),g=cx.createRadialGradient(p.x-r*.35,p.y-r*.4,r*.1,p.x,p.y,r);g.addColorStop(0,['#fff','#fff3a8','#ffb0b0'][i]);g.addColorStop(.45,BALL_COL[i]);g.addColorStop(1,['#a9b8b0','#bf8516','#a92a3d'][i]);
 cx.save();cx.globalAlpha=alpha;cx.shadowColor='#0008';cx.shadowBlur=6*DPR;cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.fillStyle=g;cx.fill();cx.restore();}
function cue(p,ang,gap,alpha){const m=SC,c=S2(p[0],p[1]),dx=Math.cos(ang),dy=Math.sin(ang),tip=P.R*m+gap*m,len=1.45*m,x0=c.x-dx*tip,y0=c.y-dy*tip,x1=c.x-dx*(tip+len),y1=c.y-dy*(tip+len),nx=-dy,ny=dx,w0=.0065*m,w1=.016*m;
 cx.save();cx.globalAlpha=alpha;cx.shadowColor='#0009';cx.shadowBlur=.015*m;cx.shadowOffsetY=.01*m;
 const seg=(u0,u1,c0,c1)=>{const xa=x0+(x1-x0)*u0,ya=y0+(y1-y0)*u0,xb=x0+(x1-x0)*u1,yb=y0+(y1-y0)*u1,wa=w0+(w1-w0)*u0,wb=w0+(w1-w0)*u1;cx.beginPath();cx.moveTo(xa+nx*wa,ya+ny*wa);cx.lineTo(xb+nx*wb,yb+ny*wb);cx.lineTo(xb-nx*wb,yb-ny*wb);cx.lineTo(xa-nx*wa,ya-ny*wa);cx.closePath();
  const g=cx.createLinearGradient(xa+nx*wa,ya+ny*wa,xa-nx*wa,ya-ny*wa);g.addColorStop(0,c0);g.addColorStop(.5,c1);g.addColorStop(1,c0);cx.fillStyle=g;cx.fill();};
 seg(0,.012,'#2e6fd6','#5b9bff');seg(.012,.03,'#e9e7e0','#fff');seg(.03,.62,'#c9a26b','#efd3a2');seg(.62,.66,'#1b1b1b','#3a3a3a');seg(.66,.97,'#3b1f12','#6a3a20');seg(.97,1,'#111','#2a2a2a');cx.restore();}
function tipBall(c,x,y,R,s,col){const g=c.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R);g.addColorStop(0,'#fff');g.addColorStop(.55,'#e8ece6');g.addColorStop(1,'#a7b2ac');c.beginPath();c.arc(x,y,R,0,7);c.fillStyle=g;c.fill();
 c.strokeStyle='rgba(60,75,70,.55)';c.lineWidth=1;c.beginPath();c.moveTo(x-R,y);c.lineTo(x+R,y);c.moveTo(x,y-R);c.lineTo(x,y+R);c.stroke();c.beginPath();c.arc(x,y,R*.5,0,7);c.stroke();
 const tx=x+clamp(s[2],-.55,.55)*R,ty=y-clamp(s[3],-.55,.55)*R;c.beginPath();c.arc(tx,ty,R*.2,0,7);c.fillStyle=col;c.fill();c.strokeStyle='#0b0f14';c.lineWidth=2;c.stroke();}
function guideCard(a,kind,al){
 if(al<=0)return;const s=a.sh[kind],k=Math.max(.8,Math.min(1.5,cv.height/(420*DPR)))*DPR,R=30*k,pad=9*k,fs=Math.round(13*k),fsB=Math.round(14*k),tw=120*k,cw=pad*3+R*2+tw,ch=Math.max(R*2+pad*2,fsB+fs*4.5+pad*2);
 const c=S2(a.pre[a.cue][0],a.pre[a.cue][1]),ang=angOf(a,kind),dx=Math.cos(ang),dy=Math.sin(ang),W=cv.width,H=cv.height,d=BR()*3+Math.max(cw,ch)*.62;
 const others=[0,1,2].filter(b=>b!==a.cue).map(b=>S2(a.pre[b][0],a.pre[b][1])),br=BR()*2.2;let best=null;
 for(const dd of [d,d*1.35])for(let i=0;i<16;i++){const t=i/16*Math.PI*2,ux=Math.cos(t),uy=Math.sin(t),x=clamp(c.x+ux*dd-cw/2,4,W-cw-4),y=clamp(c.y+uy*dd-ch/2,4,H-ch-4),qx=x+cw/2-c.x,qy=y+ch/2-c.y,L=Math.hypot(qx,qy)||1,v=(qx*dx+qy*dy)/L;
  let sc=Math.max(0,-v)*cw*.9+Math.max(0,v)*cw*.35+(dd>d?cw*.15:0);if(c.x>x-br&&c.x<x+cw+br&&c.y>y-br&&c.y<y+ch+br)sc+=cw*5;for(const o of others)if(o.x>x-br&&o.x<x+cw+br&&o.y>y-br&&o.y<y+ch+br)sc+=cw*3;if(!best||sc<best.sc)best={sc,x,y};}
 const x=best.x,y=best.y,col=COL[kind];cx.save();cx.globalAlpha=al;rr(x,y,cw,ch,11*k);cx.fillStyle='rgba(10,16,24,.84)';cx.fill();cx.strokeStyle=col;cx.lineWidth=1.5*k;cx.stroke();
 tipBall(cx,x+pad+R,y+ch/2,R,s.s,col);const lx=x+pad*2+R*2;let ly=y+pad+fsB;cx.textAlign='left';cx.fillStyle=col;cx.font=`800 ${fsB}px system-ui`;cx.fillText(KO[kind]+' 샷',lx,ly);
 cx.fillStyle='#e9eef5';cx.font=`600 ${fs}px system-ui`;ly+=fs*1.4;cx.fillText('당점 '+s.tip,lx,ly);ly+=fs*1.4;cx.fillText('세기',lx,ly);const mx=lx+fs*2.3,bw=fs*.62,bh=fs*.8;
 for(let i=0;i<5;i++){cx.fillStyle=i<s.pw?col:'rgba(255,255,255,.18)';cx.fillRect(mx+i*(bw+2*k),ly-bh,bw,bh);}cx.fillStyle='#e9eef5';cx.fillText(s.pw<=2?'약':s.pw>=4?'강':'중',mx+5*(bw+2*k)+4*k,ly);
 if(s.cut){ly+=fs*1.4;cx.fillText('두께 '+s.cut,lx,ly);}cx.restore();}

/* ---------- motion data ---------- */
const simCache=new Map();
function ordered(a){const o=[0,1,2].filter(b=>b!==a.cue);return [a.cue,...o].map(b=>({x:a.pre[b][0],y:a.pre[b][1]}));}
const toReal=(a,k)=>k===0?a.cue:[0,1,2].filter(b=>b!==a.cue)[k-1];
function track(a,kind){ // -> {dur, pos(t)->[[x,y]x3], path:[[x,y]...] of cue}
 const key=SH+kind;if(simCache.has(key))return simCache.get(key);let out=null;
 if(kind==='act'){const T=a.tr,fps=T.fps,n=T.d.length/6,fr=k=>[0,1,2].map(b=>[T.d[k*6+b*2]/100,T.d[k*6+b*2+1]/100]);
  out={dur:(n-1)/fps,pos:t=>{const u=clamp(t*fps,0,n-1),k=Math.floor(u),f=u-k,A=fr(k),B=fr(Math.min(n-1,k+1));return A.map((p,i)=>[p[0]+(B[i][0]-p[0])*f,p[1]+(B[i][1]-p[1])*f]);},path:[...Array(n).keys()].map(k=>fr(k)[a.cue])};}
 else{const s=a.sh[kind].s,r=P.simulate(ordered(a),{angle:s[0],speed:s[1],tipX:s[2],tipY:s[3]},{record:true,dt:.006,maxC:6,model:G.model||{}});
  const F=r.frames.map(f=>{const p=[null,null,null];f.p.forEach((q,k)=>p[toReal(a,k)]=[q.x,q.y]);return {t:f.t,p};});
  out={dur:F[F.length-1].t,pos:t=>{let k=0;while(k<F.length-1&&F[k+1].t<=t)k++;const f=F[k],g=F[Math.min(F.length-1,k+1)],u=g.t>f.t?clamp((t-f.t)/(g.t-f.t),0,1):0;return f.p.map((q,i)=>[q[0]+(g.p[i][0]-q[0])*u,q[1]+(g.p[i][1]-q[1])*u]);},path:F.map(f=>f.p[a.cue])};}
 simCache.set(key,out);return out;}
function angOf(a,kind){const s=a.sh[kind]||a.sh.act||a.sh.rec;if(s)return s.s[0];return 0;}

function path(pts,col,dash){if(pts.length<2)return;cx.save();cx.strokeStyle=col;cx.lineWidth=2.2*DPR;cx.setLineDash(dash.map(v=>v*DPR));cx.globalAlpha=.95;cx.lineJoin='round';cx.beginPath();pts.forEach((p,i)=>{const q=S2(p[0],p[1]);i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y);});cx.stroke();cx.restore();}
function draw(){
 if(!G||SH<0)return;const a=LIST[SH];cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);table();
 if(M.show.rec&&a.sh.rec)path(track(a,'rec').path,COL.rec,[8,5]);
 if(M.show.fix&&a.sh.fix)path(track(a,'fix').path,COL.fix,[3,4]);
 if(M.show.act&&a.tr)path(track(a,'act').path,COL.act,[]);
 if(M.anim){const p=M.anim.pos();p.forEach((q,i)=>q&&ball(S2(q[0],q[1]),i));const c=M.anim.cue();if(c)cue(a.pre[a.cue],c.ang,c.gap,c.alpha);if(M.guide)guideCard(a,M.guide.kind,M.guide.alpha());}
 else{a.pre.forEach((q,i)=>ball(S2(q[0],q[1]),i));cue(a.pre[a.cue],angOf(a,'rec'),.05,.95);}
}
function stop(){cancelAnimationFrame(M.raf);M.anim=null;M.guide=null;M.mode='freeze';}
function play(kind){
 const a=LIST[SH];if(!a||!a.sh[kind])return;stop();const tr=track(a,kind),ang=angOf(a,kind),PRE=1.6,STK=.75,ST=PRE+STK,t0=performance.now(),rate=+$('rate').value;
 const el0=()=>(performance.now()-t0)/1000*rate,el=()=>Math.max(0,el0()-PRE);
 M.guide={kind,alpha:()=>{const e=el0();return e<.25?e/.25:e<ST+.5?1:Math.max(0,1-(e-ST-.5)/.4);}};
 M.anim={pos:()=>tr.pos(clamp(el0()-ST,0,tr.dur)),cue:()=>{const e=el();if(e<.25)return {ang,gap:.05,alpha:1};if(e<.6){const u=(e-.25)/.35;return {ang,gap:.05+.17*Math.sin(u*Math.PI/2),alpha:1};}
  if(e<STK){const u=(e-.6)/(STK-.6);return {ang,gap:.22-.22*u*u,alpha:1};}const f=e-STK;return f<.45?{ang,gap:-.06*Math.min(1,f/.12),alpha:1-f/.45}:null;}};
 M.mode='sim';const tick=()=>{draw();if(el0()<tr.dur+ST+.3)M.raf=requestAnimationFrame(tick);else M.mode='end';};tick();
}
function _unusedVideoLink(){const a=LIST[SH],t=Math.max(0,Math.floor(a.t0-2)),u=G.yt;if(!u)return;
 let url=u;if(/youtu\.?be/.test(u)){url=u.replace(/([?&])t=\d+s?/,'$1').replace(/[?&]$/,'');url+=(url.includes('?')?'&':'?')+'t='+t;}else url=u.split('#')[0]+'#t='+t;window.open(url,'_blank','noopener');}

/* ---------- wiring ---------- */
for(const k of ['rec','act','fix']){$('b_'+k).onclick=()=>play(k);$('c_'+k).onchange=e=>{M.show[k]=e.target.checked;e.target.closest('.pl').classList.toggle('on',e.target.checked);if(M.mode!=='sim')draw();};}
$('bPrev').onclick=()=>openShot(SH-1);$('bNext').onclick=()=>openShot(SH+1);$('bBack').onclick=()=>{stop();stopSay();show('scHome');};
cv.addEventListener('click',()=>{if(M.mode!=='freeze'){stop();draw();}});
{let sx=0,sy=0;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)openShot(SH+(dx<0?1:-1));},{passive:true});}
addEventListener('resize',()=>{if(!$('scShot').hidden){resize();draw();}});
