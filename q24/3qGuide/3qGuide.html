/* Position Guide planar sphere model. All units are SI; no video processing. */
function createPhysics(){

 if(Math.hypot(S.positions[drag.id].x-next.x,S.positions[drag.id].y-next.y)>.001){S.positions=copy;if(!downMoved){if(drag.snapshot){previousView=drag.snapshot;syncReplayButton();}S.routes=[];S.current=null;S.manual=false;lastSearch=null;renderRoutes();renderGuide();updateTime();}downMoved=true;}
 draw();
}
board.addEventListener('pointerdown',e=>{
 if(e.button!=null&&e.button!==0)return;e.preventDefault();const p=pointerWorld(e);if(p.x<0||p.x>P.W||p.y<0||p.y>P.H)return;
 const rect=board.getBoundingClientRect(),radius=Math.max(P.R*1.8,24/rect.width*CW/SS);
 let best=-1,dist=radius;for(let i=0;i<3;i++){const d=Math.hypot(S.positions[i].x-p.x,S.positions[i].y-p.y);if(d<dist){best=i;dist=d;}}
 // Empty-table taps do not move a hidden selected ball. Grab a ball directly.
 if(best<0)return;
 const id=best,snapshot=captureReplayView();hideCueTip();stopAnimation();cancelSearch(true);S.time=0;drag={id,snapshot,old:COPY(S.positions),startedX:e.clientX,startedY:e.clientY};downMoved=false;selectBall(id);board.setPointerCapture(e.pointerId);
 draw();
});
board.addEventListener('pointermove',e=>{if(drag){e.preventDefault();if(Math.hypot(e.clientX-drag.startedX,e.clientY-drag.startedY)>3||downMoved)moveBall(e);}});
function finishDrag(e){if(!drag)return;drag=null;if(board.hasPointerCapture(e.pointerId))board.releasePointerCapture(e.pointerId);if(downMoved)changePosition();else{draw();updateTime();}}
board.addEventListener('pointerup',finishDrag);board.addEventListener('pointercancel',finishDrag);
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{rememberPreviousView();S.level=+b.dataset.level;renderGuide();compute();});
$('randomBtn').onclick=()=>{rememberPreviousView();let p;for(let n=0;n<1000;n++){p=[0,1,2].map(()=>({x:.13+Math.random()*(P.W-.26),y:.13+Math.random()*(P.H-.26)}));if(P.validate(p)&&p.every((a,i)=>p.every((b,j)=>i===j||Math.hypot(a.x-b.x,a.y-b.y)>.23)))break;}S.positions=p;lastSearch=null;toast(T.randomInfo);compute();};
$('replayBtn').onclick=replayPrevious;$('showCueTip').onclick=requestCueTip;
$('searchBtn').onclick=()=>{rememberPreviousView();compute();};$('deeperBtn').onclick=()=>{rememberPreviousView();cache.delete(positionKey()+'|true');compute(true);};$('cancelBtn').onclick=()=>{cancelSearch();S.stopped=true;renderRoutes();renderGuide();draw();updateTime();showCueTip();};$('playBtn').onclick=togglePlay;$('resetPlay').onclick=()=>{stopAnimation();S.time=0;draw();updateTime();showCueTip();};
$('timeline').oninput=()=>{if(!S.current)return;hideCueTip();stopAnimation();S.time=+$('timeline').value/1000*S.current.duration;draw();updateTime();};
for(const id of ['tipX','tipY','speed','aimAdjust'])$(id).addEventListener('input',manualSim);
$('restoreGuide').onclick=()=>choose(S.choice);
$('showObjectPaths').onchange=draw;$('showAll').onchange=draw;$('tableFeel').onchange=()=>{rememberPreviousView();S.tableFeel=$('tableFeel').value;compute();};
function snapshot(){return {format:'three-cushion-position-guide',version:1,guideVersion:'1.3',base:'3cushion_video_v3_6',positions:COPY(S.positions),level:S.level,tableFeel:S.tableFeel,selectedGuide:S.current?{shot:S.current.shot,events:S.current.events,modelRule:S.current.rule,modelEstimateOnly:true,kind:S.current.kind,provisional:!!S.current.provisional,expanded:!!S.current.extended}:null};}
function validSnapshot(d){return d&&d.format==='three-cushion-position-guide'&&d.version===1&&P.validate(d.positions)&&[1,2,3].includes(d.level)&&['normal','fast','slow'].includes(d.tableFeel);}
$('saveBtn').onclick=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(snapshot()));toast(T.saved);}catch(e){toast(T.saveFail);}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='3cushion_position.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);};
$('importBtn').onclick=()=>{$('importFile').value='';$('importFile').click();};
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>200000){toast(T.fileTooBig);return;}try{const data=JSON.parse(await f.text());if(!validSnapshot(data))throw Error('invalid');rememberPreviousView();S.positions=COPY(data.positions);S.level=data.level;S.tableFeel=data.tableFeel;$('tableFeel').value=S.tableFeel;lastSearch=null;toast(T.loaded);compute();}catch(e){toast(T.badFile);}};
$('helpBtn').onclick=()=>{hideCueTip();stopAnimation();updateTime();$('helpDialog').showModal();};$('helpClose').onclick=()=>$('helpDialog').close();
document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||$('helpDialog').open||/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName))return;e.preventDefault();togglePlay();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hideCueTip();stopAnimation();updateTime();}});
const onCompactChange=()=>{if(compactMedia.matches)showCueTip();else hideCueTip();};
if(compactMedia.addEventListener)compactMedia.addEventListener('change',onCompactChange);else compactMedia.addListener(onCompactChange);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(board);else window.addEventListener('resize',resize);
try{const d=JSON.parse(localStorage.getItem(STORAGE)||'null');if(validSnapshot(d)){S.positions=COPY(d.positions);S.level=d.level;S.tableFeel=d.tableFeel;$('tableFeel').value=S.tableFeel;}}catch(e){}
renderRoutes();renderGuide();selectBall(0);resize();updateTime();setStatus(T.waiting);setTimeout(compute,150);
// Read-only diagnostic hooks for regression testing and future camera-position integration.
window.GuideApp={physics:P,state:S,compute,choose,snapshot,cancel:cancelSearch,get lastSearch(){return lastSearch;},replay:replayPrevious,showTip:requestCueTip,get replayAvailable(){return !!(lastPlayback||previousView);},get tipVisible(){return !$('cueTipBubble').hidden;},loadPositions(p){if(!P.validate(p))throw Error('INVALID_POSITION');rememberPreviousView();S.positions=COPY(p);lastSearch=null;compute();}};

</script>
