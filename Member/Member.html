<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>CUE24 회원</title>
<style>
:root{--bg:#0a1120;--bg2:#0f1a2e;--card:#14223a;--card2:#1a2c4a;--line:#24395c;--tx:#eaf2ff;--mut:#93a8c8;--blue:#2f8bff;--cyan:#38c6ff;--org:#ff8a2a;--grn:#35d39a;--red:#ff5d57;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% -10%,#173058 0%,var(--bg) 60%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;background:var(--card2);padding:12px 14px;font-weight:800;min-height:48px}
button:disabled{opacity:.5}
input{width:100%;background:#0c1729;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:50px;outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,198,255,.18)}
label{display:block;font-size:14px;color:var(--mut);font-weight:700;margin:12px 0 6px}
.view{max-width:560px;margin:0 auto;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:min(260px,66vw);border-radius:22px;box-shadow:0 10px 40px rgba(47,139,255,.25);margin:10px auto 6px;display:block}
.h1{font-size:22px;font-weight:900;margin:14px 0 4px}.sub{color:var(--mut);font-size:14px;margin:0}
.pri{background:linear-gradient(135deg,#2f8bff,#1f63d6);color:#fff;box-shadow:0 6px 18px rgba(47,139,255,.35)}
.org{background:linear-gradient(135deg,#ff9a3c,#f2711c);color:#fff;box-shadow:0 6px 18px rgba(255,138,42,.3)}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--tx)}
.link{background:none;min-height:auto;padding:6px;color:var(--cyan);font-weight:700}
.full{width:100%}
.err{color:#ff8f8a;font-weight:700;font-size:14px;min-height:1.2em;margin:10px 0 0;white-space:pre-wrap}
.hint{color:var(--mut);font-size:13px}
/* 매장 선택 */
.search{margin:16px 0 10px}
.store{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);margin-bottom:10px;padding:14px;border-radius:var(--r)}
.store:active{transform:scale(.99)}
.store .ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;object-fit:cover}
.store b{display:block;font-size:17px}.store small{color:var(--mut);font-weight:600}
.tier{margin-left:auto;font-size:12px;font-weight:900;border-radius:9px;padding:4px 8px;background:#1d3355;color:#9cc9ff;flex-shrink:0}.tier.pro{background:#3b2410;color:#ffb46b}
/* 가입·로그인 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0c1729;border:1.5px solid var(--line);border-radius:16px;padding:4px;margin:18px 0 4px}
.seg button{min-height:44px;background:none;color:var(--mut)}.seg button.on{background:var(--card2);color:#fff}
.formCard{width:100%;text-align:left}
.note{background:#132744;border:1px solid #23466f;border-radius:14px;padding:10px 12px;font-size:13px;color:#b9d3f3;margin-top:12px}
/* 상단 · 하단 */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 2px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.top img{width:40px;height:40px;border-radius:12px}
.top b{font-size:17px;display:block;line-height:1.2}.top small{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#667;display:inline-block}.dot.on{background:var(--grn);box-shadow:0 0 6px var(--grn)}.dot.warn{background:var(--org)}
.top .rf{margin-left:auto;min-height:40px;width:40px;padding:0;border-radius:12px;background:var(--card)}
.actBar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:center;padding:8px 12px;background:linear-gradient(transparent,rgba(10,17,32,.95) 30%)}
.actBar div{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}.actBar button{min-height:60px;font-size:19px;border-radius:16px}
#tHome{padding-bottom:84px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:rgba(10,17,32,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.bnav div{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:560px}
.bnav button{background:none;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:12px;padding:6px}
.bnav button i{font-style:normal;font-size:22px;line-height:1}
.bnav button.on{color:#fff}.bnav button.on i{filter:drop-shadow(0 0 6px var(--cyan))}
/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.secT{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.secT h3{margin:0;font-size:17px}.secT small{color:var(--mut)}
/* 내 상태 */
.my{background:linear-gradient(150deg,#16305a,#13213b 60%);border:1px solid #2a4c80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.myHead{display:flex;align-items:center;gap:12px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.myHead b{font-size:19px}.myHead small{display:block;color:var(--mut);font-size:13px}
.state{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-weight:800;font-size:15px}
.state .pill{border-radius:999px;padding:5px 12px;font-size:14px;background:#22324d;color:#cfe0f7}
.pill.in{background:rgba(53,211,154,.16);color:#7ff0c3}.pill.rest{background:rgba(255,200,80,.14);color:#ffd27a}.pill.req{background:rgba(255,93,87,.16);color:#ff9b96}
.where{color:#cfe0f7;font-size:14px;margin:6px 0 0}
.big{width:100%;min-height:64px;font-size:19px;border-radius:18px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.acts2 button{min-height:58px;font-size:17px;border-radius:16px}
.mini{display:flex;justify-content:center;margin-top:8px}
/* 요약 */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp button{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.kp b{font-size:24px;line-height:1}.kp span{font-size:12px;color:var(--mut);font-weight:700}
.kp .g b{color:var(--grn)}.kp .b b{color:var(--cyan)}.kp .o b{color:var(--org)}
/* 공지 */
.nt{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.nt.ev{border-left-color:var(--org)}
.nt summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:flex-start}.nt summary::-webkit-details-marker{display:none}
.nt .k{flex-shrink:0;font-size:12px;font-weight:900;border-radius:8px;padding:2px 7px;background:#1d3355;color:#9cc9ff;margin-top:2px}.nt.ev .k{background:#3b2410;color:#ffb46b}
.nt summary b{flex:1}.nt p{margin:8px 0 0;white-space:pre-wrap;color:#c7d6ee;font-size:15px}.nt small{color:var(--mut);font-size:12px}
.info{white-space:pre-wrap;color:#c7d6ee;font-size:15px;margin:8px 0 0}
details.card summary{font-weight:800;cursor:pointer}
/* 현황 */
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tb{border-radius:16px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:6px;background:#122036;border:1.5px dashed #2c4566}
.tb.on{background:linear-gradient(160deg,#1f6fe0,#1450b0);border:1.5px solid #4aa0ff;box-shadow:0 4px 18px rgba(47,139,255,.28)}
.tb.t-f.on{box-shadow:0 0 0 2px var(--grn) inset}.tb.t-t.on{box-shadow:0 0 0 2px var(--org) inset}
.tb.mine{outline:3px solid #ffd27a;outline-offset:2px}
.tb .n{display:flex;align-items:center;justify-content:space-between}.tb .n b{font-size:22px}.tb .n span{font-size:12px;font-weight:900;border-radius:8px;padding:3px 8px;background:rgba(0,0,0,.25)}
.tb .nm{font-size:14px;font-weight:700;color:#e3eeff}.tb.off .nm{color:var(--mut);font-weight:600}
.tb .tm{margin-top:auto;font-size:13px;color:#d8e8ff;font-weight:700}
.wg{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.wg i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#000a;font-weight:900;flex-shrink:0}
.wg .ty{font-size:12px;font-weight:900;border-radius:8px;padding:2px 7px;flex-shrink:0}
.ty.p{background:#1d3355;color:#9cc9ff}.ty.f{background:#14402f;color:#7ff0c3}.ty.t{background:#3b2410;color:#ffb46b}
.wg.mine{outline:2px solid #ffd27a}
.empty{color:var(--mut);text-align:center;padding:22px 10px;font-size:14px}
/* 내 정보 */
.prof{display:flex;align-items:center;gap:14px}.prof .av{width:64px;height:64px;font-size:24px}
.prof b{font-size:21px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bd{font-size:12px;font-weight:900;border-radius:8px;padding:3px 8px;background:#1d3355;color:#9cc9ff}.bd.m{background:#3a2a0b;color:#ffd27a}.bd.f{background:#14402f;color:#7ff0c3}.bd.t{background:#3b2410;color:#ffb46b}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.st span{display:block;font-size:12px;color:var(--mut);font-weight:700}.st b{font-size:22px}.st small{color:var(--mut);font-size:12px;font-weight:600}
.st.wait b{font-size:15px;color:var(--mut)}
.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu button{width:100%;display:flex;align-items:center;gap:12px;background:none;border-radius:0;border-bottom:1px solid var(--line);padding:15px 16px;text-align:left;font-weight:700;min-height:56px}
.menu button:last-child{border-bottom:0}.menu button em{margin-left:auto;font-style:normal;color:var(--mut);font-size:13px;font-weight:700}
.menu button em.on{color:var(--grn)}
/* 알림·대화창 */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:#eaf2ff;color:#0a1120;font-weight:800;border-radius:14px;padding:12px 16px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--bg2);color:var(--tx);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(3,8,18,.7);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 8px;font-size:19px}dialog p{color:#c7d6ee;margin:6px 0;white-space:pre-wrap}
.dBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.dBtns.one{grid-template-columns:1fr}
[hidden]{display:none!important}
.busy{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,8,18,.55)}
.busy div{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px 22px;font-weight:800;display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #2f8bff44;border-top-color:var(--cyan);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.doorOk{font-size:64px;text-align:center;animation:pop .5s ease}@keyframes pop{from{transform:scale(.5);opacity:0}}
.steps{margin:8px 0 0;padding-left:20px;color:#c7d6ee}.steps li{margin:4px 0}
.ver{color:#4f6688;font-size:12px;text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<!-- ① 당구장 선택 -->
<section class="view center" id="vStore" hidden>
 <img class="logo" alt="CUE24 큐24">
 <div class="h1">이용할 당구장을 고르세요</div>
 <p class="sub">Q24 시스템을 쓰는 당구장입니다</p>
 <input class="search" id="sQ" placeholder="🔍 매장 이름·주소 검색" autocomplete="off">
 <div id="sList" style="width:100%"></div>
 <p class="hint" id="sHint">매장 목록을 불러오는 중…</p>
 <button class="link" id="sInstall" hidden>📲 홈 화면에 앱으로 추가</button>
</section>

<!-- ② 로그인 · 가입 -->
<section class="view center" id="vAuth" hidden>
 <img class="logo" alt="CUE24 큐24" style="width:min(200px,52vw)">
 <div class="h1" id="aStore"></div><button class="link" id="aChange">다른 당구장 고르기</button>
 <div class="seg" style="width:100%"><button id="aTabIn" class="on">로그인</button><button id="aTabUp">회원 가입</button></div>
 <form id="fIn" class="formCard" autocomplete="on">
  <label for="iUid">아이디</label><input id="iUid" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label for="iPw">비밀번호</label><input id="iPw" type="password" autocomplete="current-password">
  <p class="err" id="iErr"></p>
  <button class="pri full big" type="submit">로그인</button>
 </form>
 <form id="fUp" class="formCard" hidden autocomplete="off">
  <div class="note">① 먼저 <b>매장 인식기</b>에서 회원 등록을 해 주세요.<br>② 등록한 <b>닉네임 · 이름 · 휴대폰 번호 중 하나</b>로 이 매장 회원인지 확인한 뒤 가입됩니다.</div>
  <label for="uWho">본인 확인 <span class="hint">(닉네임 · 이름 · 휴대폰 번호 중 하나)</span></label><input id="uWho" placeholder="예: 큐왕 또는 01012345678" autocomplete="off">
  <label for="uUid">사용할 아이디 <span class="hint">(영문 소문자·숫자 4~16자)</span></label><input id="uUid" autocapitalize="none" spellcheck="false" autocomplete="username">
  <label for="uPw">비밀번호 <span class="hint">(6자 이상)</span></label><input id="uPw" type="password" autocomplete="new-password">
  <label for="uPw2">비밀번호 확인</label><input id="uPw2" type="password" autocomplete="new-password">
  <p class="err" id="uErr"></p>
  <button class="pri full big" type="submit">본인 확인하고 가입</button>
 </form>
</section>

<!-- ③ 본 화면 -->
<section class="view" id="vMain" hidden>
 <header class="top"><img id="hMark" alt=""><div><b id="hStore"></b><small><i class="dot" id="hDot"></i><span id="hConn">연결 중</span></small></div><button class="rf" id="hRefresh" aria-label="새로고침">⟳</button></header>

 <div class="tab" id="tHome">
  <div class="card my" id="myCard"></div>
  <div class="kp" id="kp"></div>
  <div class="secT"><h3>📢 공지 · 이벤트</h3><small id="ntCnt"></small></div>
  <div id="ntBox"></div>
  <details class="card" id="infoBox" hidden><summary>ℹ️ 매장 안내 · 요금</summary><p class="info" id="infoTx"></p><p class="hint" id="infoAddr"></p></details>
 </div>

 <div class="tab" id="tLive" hidden>
  <div class="secT" style="margin-top:4px"><h3>🎱 경기 현황</h3><small id="lvUpd"></small></div>
  <div class="tg" id="lvTables"></div>
  <div class="secT"><h3>⏳ 대기조</h3><small id="lvWaitN"></small></div>
  <div id="lvWait"></div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>🙋 휴식방 (대기 전)</b><b id="lvRoom" style="color:var(--cyan)"></b></div>
  <p class="hint" style="text-align:center">이름은 닉네임만 보입니다 · 내 자리는 노란 테두리</p>
 </div>

 <div class="tab" id="tMe" hidden>
  <div class="card" id="profCard"></div>
  <div class="secT"><h3>📊 내 기록</h3><small>점수판 연동 항목은 준비 중</small></div>
  <div class="stats" id="stats"></div>
  <div id="videoBox"></div>
  <div class="secT"><h3>⚙️ 설정</h3></div>
  <div class="menu">
   <button id="mPush">🔔 내 알림 받기 <em id="mPushSt">꺼짐</em></button>
   <button id="mNotice">📢 공지·이벤트 알림 받기 <em>ntfy</em></button>
   <button id="mInstall" hidden>📲 홈 화면에 앱으로 추가</button>
   <button id="mPw">🔑 비밀번호 바꾸기</button>
   <button id="mStore">🏠 다른 당구장 고르기</button>
   <button id="mOut">🚪 로그아웃</button>
  </div>
  <p class="ver">CUE24 회원 웹 v<span id="verTx"></span> · Q24 무인 당구장 시스템</p>
 </div>

 <div class="actBar" id="actBar"><div><button type="button" class="pri" id="btnIn">🚪 입장</button><button type="button" class="org" id="btnOut">👋 퇴실</button></div></div>
 <nav class="bnav"><div><button data-t="tHome" class="on"><i>🏠</i>홈</button><button data-t="tLive"><i>🎱</i>현황</button><button data-t="tMe"><i>👤</i>내 정보</button></div></nav>
</section>

<dialog id="dlg"><h3 id="dT"></h3><div id="dB"></div><div class="dBtns" id="dBtns"></div></dialog>
<div id="toast" hidden></div>
<div class="busy" id="busy" hidden><div><span class="spin"></span><span id="busyTx">처리 중…</span></div></div>

<script>
'use strict';
/* =========================================================
 CUE24 회원 웹 (Q24 무인 당구장 시스템)
 - 매장 인식기가 매장 서버 역할: 가입·로그인·입실·휴식·퇴실 요청을 처리
 - q24/v1/dir/+ : Q24 매장 목록 (인식기가 서명해서 올림)
 - <base>/m/pub : 매장 안내·공지·경기 현황 (서명 확인)

const APP_VERSION='1.03',ST_KEY='cue24m',BROKER=new URLSearchParams(location.search).get('b')||'wss://broker.emqx.io:8084/mqtt';
const LIBS=['https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'];
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');

function dialog(title,body,btns){
 return new Promise(res=>{const d=$('dlg');$('dT').textContent=title;$('dB').replaceChildren(...(Array.isArray(body)?body:[typeof body==='string'?el('p',{textContent:body}):body]));
  const bx=$('dBtns');bx.replaceChildren();bx.className='dBtns'+(btns.length===1?' one':'');

}

let client=null,online=false,libP=null,waiters={},pub=null,meData=null,dirList={},pollT=null;
function loadLib(){if(window.mqtt)return Promise.resolve();if(libP)return libP;
 libP=(async()=>{for(const src of LIBS){try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';const t=setTimeout(()=>{s.remove();no(Error('timeout'))},20000);s.onload=()=>{clearTimeout(t);ok()};s.onerror=()=>{clearTimeout(t);s.remove();no(Error('load'))};document.head.append(s)});if(window.mqtt)return}catch{}}libP=null;throw Error('인터넷 연결을 확인해 주세요.')})();
 return libP}
function connState(st,tx){$('hDot').className='dot'+(st?' '+st:'');$('hConn').textContent=tx}
async function connect(){
 await loadLib();if(client)return;
 client=mqtt.connect(BROKER,{clientId:'cue24m_'+hex(5),clean:true,keepalive:30,reconnectPeriod:4000,connectTimeout:15000});
 client.on('connect',()=>{online=true;connState('on','연결됨');resubscribe();if(!$('vMain').hidden)refreshMe()});
 client.on('reconnect',()=>connState('warn','다시 연결 중…'));
 client.on('offline',()=>{online=false;connState('warn','연결 끊김 · 재연결 중')});
 client.on('message',(t,p)=>onMessage(t,dec.decode(p)));
}
let subs=new Set();
function sub(t){subs.add(t);if(online)client.subscribe(t,{qos:1})}
function unsub(t){subs.delete(t);if(online)try{client.unsubscribe(t)}catch{}}
function resubscribe(){if(subs.size)client.subscribe([...subs],{qos:1})}
async function verify(text,pin){
 try{const o=JSON.parse(text);if(!o.p||!o.s||!o.k)return null;if(pin&&o.k!==pin)return{changed:true};
  const key=await crypto.subtle.importKey('raw',unb64(o.k),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,unb64(o.s),enc.encode(o.p))?{data:JSON.parse(o.p),k:o.k}:null}catch{return null}
}
async function onMessage(t,text){
 if(waiters[t]){const w=waiters[t];delete waiters[t];clearTimeout(w.tm);unsub(t);
  try{const o=JSON.parse(text),r=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},w.key,unb64(o.c))));w.ok(r)}catch(e){w.no(Error('응답을 풀지 못했습니다.'))}return}
 if(t.startsWith('q24/v1/dir/')){
  const id=t.split('/').pop();if(!text){delete dirList[id];renderStores();return}
  const v=await verify(text);if(!v||v.data.type!=='q24store'||v.data.id!==id)return;
  dirList[id]={...v.data,sk:v.k};

/* 요청: 1회용 ECDH 키 → 매장 인식기만 풀 수 있음 */
async function call(op,data={},tx){
 const c=cur();if(!c)throw Error('매장을 먼저 골라 주세요.');
 if(!online)throw Error('인터넷 연결을 확인해 주세요.');
 if(tx)busy(true,tx);
 try{
  const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const spk=await crypto.subtle.importKey('raw',unb64(c.dh),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:spk},kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const rid=hex(12),q={...data,op,rid,ts:Date.now(),token:sess()?.token||''};
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(q)));
  const epk=await crypto.subtle.exportKey('raw',kp.publicKey),rt=c.base+'/m/res/'+rid;
  const r=await new Promise((ok,no)=>{
   waiters[rt]={key,ok,no,tm:setTimeout(()=>{delete waiters[rt];unsub(rt);no(Error('매장 인식기가 응답하지 않습니다.\n인식기가 꺼져 있거나 인터넷이 끊겼을 수 있습니다. 잠시 후 다시 시도해 주세요.'))},15000)};
   subs.add(rt);client.subscribe(rt,{qos:1},()=>client.publish(c.base+'/m/req',JSON.stringify({e:b64(epk),i:b64(iv),c:b64(ct)}),{qos:1}));
  });
  if(r.auth){delete S.sess[S.cur];save();meData=null;openAuth();throw Error(r.err)}
  if(!r.ok)throw Error(r.err||'처리하지 못했습니다.');
  if(r.me){meData=r.me;renderAll()}
  return r;
 }finally{if(tx)busy(false)}
}

  }else if(kind==='rest'){
   if(await dialog('휴식할까요?','현황판에 "휴식"으로 표시됩니다.\n돌아오면 [돌아왔어요]를 눌러 주세요.',[{t:'취소',cls:'ghost',v:0},{t:'☕ 휴식',cls:'pri',v:1}])!==1)return;
   const r=await call('rest',{on:true},'처리 중…');toast(r.msg);
  }else if(kind==='out'){
   const mon=!!m?.monthly;
   if(await dialog('퇴실할까요?',mon?'월회원은 바로 퇴실 처리됩니다.':'바로 퇴실됩니다. 이용 요금(결제·미수)은 관리자가 확인해 정리합니다.',[{t:'취소',cls:'ghost',v:0},{t:'👋 퇴실',cls:'org',v:1}])!==1)return;
   const r=await call('out',{},'처리 중…');await dialog('안녕히 가세요!',r.msg,[{t:'확인',cls:'pri'}]);
  }else if(kind==='outCancel'){const r=await call('outCancel',{},'처리 중…');toast(r.msg)}
 }catch(e){busy(false);dialog('알림',e.message,[{t:'확인',cls:'pri'}])}
}

/* ---------- 알림 (ntfy) ---------- */
const pushServer=()=>(pub?.store?.push||'https://ntfy.sh').replace(/\/+$/,'');
function ntfySteps(url){return[el('ol',{className:'steps'},el('li',{textContent:'아래 [ntfy 열기]를 누르세요.'}),el('li',{},'열린 화면에서 ',el('b',{textContent:'구독(Subscribe)'}),'을 누르고 알림을 ',el('b',{textContent:'허용'}),'하세요.'),el('li',{},'ntfy 설정에서 ',el('b',{textContent:'백그라운드 알림'}),'을 켜면 이 웹을 닫아도 알림이 옵니다.')),el('p',{className:'hint',textContent:'앱을 따로 설치하지 않아도 됩니다 (ntfy 웹)'})]}
$('mPush').onclick=async()=>{
 const m=meData;if(!m)return;
 if(m.push){if(await dialog('내 알림 끄기','퇴실 완료 등 개인 알림을 그만 받을까요?',[{t:'취소',cls:'ghost',v:0},{t:'끄기',cls:'org',v:1}])!==1)return;try{await call('push',{topic:''},'처리 중…');toast('알림을 껐습니다.')}catch(e){toast(e.message,5000)}return}
 const topic='cue24m-'+hex(8);
 try{await call('push',{topic},'알림 연결 중…')}catch(e){toast(e.message,5000);return}
 const url=pushServer()+'/'+topic;
 if(await dialog('🔔 내 알림 받기',ntfySteps(url),[{t:'나중에',cls:'ghost',v:0},{t:'ntfy 열기',cls:'pri',v:1}])===1)window.open(url,'_blank','noopener');
};
$('mNotice').onclick=async()=>{const tp=pub?.store?.noticeTopic;if(!tp){toast('매장 정보를 불러오는 중입니다.');return}const url=pushServer()+'/'+tp;
 if(await dialog('📢 공지·이벤트 알림',ntfySteps(url),[{t:'나중에',cls:'ghost',v:0},{t:'ntfy 열기',cls:'pri',v:1}])===1)window.open(url,'_blank','noopener')};
async function editProfile(){
 const m=meData;if(!m)return;
 const f=(ph,v,a={})=>el('input',{placeholder:ph,value:v??'',autocomplete:'off',style:'margin-top:8px',...a});
 const lab=t=>el('label',{textContent:t,style:'margin:12px 0 0'});
 const iN=f('닉네임',m.nick,{maxLength:12}),iP=f('010-0000-0000',m.phone,{inputMode:'tel'}),i3=f('3구 핸디',m.h3,{inputMode:'numeric',maxLength:3}),i4=f('4구 점수',m.h4,{inputMode:'numeric',maxLength:4});
 if(await dialog('✏️ 내 정보 수정',[lab('닉네임 (현황판·입장 안내에 표시)'),iN,lab('휴대폰'),iP,lab('3구 핸디'),i3,lab('4구 점수'),i4,el('p',{className:'hint',textContent:'실제 이름은 매장 관리용이라 여기서 바꿀 수 없습니다.'})],[{t:'취소',cls:'ghost',v:0},{t:'저장',cls:'pri',v:1}])!==1)return;
 if(!iN.value.trim())return toast('닉네임을 입력해 주세요.');
 try{const r=await call('profile',{fields:{nick:iN.value.trim(),phone:iP.value,handi3:i3.value.trim(),handi4:i4.value.trim()}},'저장 중…');toast(r.msg)}catch(e){dialog('저장하지 못했습니다',e.message,[{t:'확인',cls:'pri'}])}
}
$('mPw').onclick=async()=>{
 const o=el('input',{type:'password',placeholder:'지금 비밀번호',autocomplete:'current-password'}),n=el('input',{type:'password',placeholder:'새 비밀번호 (6자 이상)',autocomplete:'new-password',style:'margin-top:10px'}),n2=el('input',{type:'password',placeholder:'새 비밀번호 확인',autocomplete:'new-password',style:'margin-top:10px'});
 if(await dialog('🔑 비밀번호 바꾸기',[o,n,n2],[{t:'취소',cls:'ghost',v:0},{t:'바꾸기',cls:'pri',v:1}])!==1)return;
 if(n.value.length<6)return toast('새 비밀번호는 6자 이상입니다.');if(n.value!==n2.value)return toast('새 비밀번호 확인이 다릅니다.');
 try{const r=await call('pw',{old:o.value,pw:n.value},'처리 중…');toast(r.msg)}catch(e){toast(e.message,5000)}
};
$('mStore').onclick=()=>{clearInterval(pollT);unsubStore();meData=null;openStores()};
$('mOut').onclick=async()=>{if(await dialog('로그아웃','이 기기에서 로그아웃할까요?',[{t:'취소',cls:'ghost',v:0},{t:'로그아웃',cls:'org',v:1}])!==1)return;try{await call('logout')}catch{}delete S.sess[S.cur];save();meData=null;clearInterval(pollT);openAuth()};

/* ---------- 앱 설치 (PWA) ---------- */
let installEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;$('mInstall').hidden=false;$('sInstall').hidden=false});
for(const id of ['mInstall','sInstall'])$(id).onclick=async()=>{if(!installEv)return;installEv.prompt();await installEv.userChoice;installEv=null;$('mInstall').hidden=true;$('sInstall').hidden=true};
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});

/* ---------- 시작 ---------- */
$('verTx').textContent=APP_VERSION;
$('btnIn').onclick=()=>act('enter');$('btnOut').onclick=()=>act('out');
for(const i of document.querySelectorAll('img.logo'))i.src=LOGO;$('hMark').src=MARK;
function start(){if(!cur())openStores();else if(!sess())openAuth();else openMain()}
(async()=>{
 const qs=new URLSearchParams(location.search).get('s');   // 매장 QR: .../Member/Member.html?s=<매장ID>
 try{busy(true,'연결 중…');await connect()}catch(e){busy(false);show('vStore');$('sHint').textContent=e.message;return}
 busy(false);
 if(qs&&!S.stores[qs]){S.cur=null;openStores();sub('q24/v1/dir/'+qs);const t0=Date.now();const w=setInterval(()=>{if(dirList[qs]){clearInterval(w);pickStore(dirList[qs])}else if(Date.now()-t0>10000)clearInterval(w)},300);return}
 if(qs)S.cur=qs;
 start();
})();
</script>
